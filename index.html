<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аквапарк — Технические работы</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f9fc; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* Стили для логотипа аквапарка */
        .logo {
            max-width: 200px; /* Ограничение ширины, чтобы логотип не был огромным */
            height: auto;
            margin: 0 auto 30px auto; /* 30px снизу — пространство, чтобы текст не прилип */
            display: block;
        }

        h2 { color: #0288d1; }
        .btn { display: inline-block; background: #4caf50; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .btn-kaspi { background: #f14635; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Логотип аквапарка. ЗАМЕНИ файл logo.png на логотип Гаваи (положи картинку в репозиторий рядом с index.html) -->
        <img src="logo.png" alt="Логотип Аквапарка" class="logo">

        <h2>На данный момент сайт hawaii.kz находится на техническом обслуживании.</h2>
        <p>Дорогие гости, приносим извинения. Аквапарк работает в обычном режиме!</p>
        <p>Билеты Вы можете приобрести в приложении Kaspi, раздел Kaspi-платежей.</p>

        <a href="https://kaspi.kz/" target="_blank" class="btn btn-kaspi">Открыть приложение Kaspi</a>
    </div>
</body>
</html>
